name: chebfun Tests
on: [push]
jobs:
  chebtest-matlab-R2023b:
    name: Chebtest Matlab R2023b
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
      - name: Run commands
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('.'); results = chebtest; assert(all([results{:,3}] > 0))

  chebtest-matlab-R2024b:
    name: Chebtest Matlab R2024b
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - name: Run commands
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('.'); results = chebtest; assert(all([results{:,3}] > 0))

  chebtest-matlab-latest:
    name: Chebtest Matlab latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Run commands
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('.'); results = chebtest; assert(all([results{:,3}] > 0))
